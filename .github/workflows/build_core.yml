name: Build PSX core (Quartus 17.0.2)

on:
  push:
    branches: [ real-subq ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # the modified core (this branch)
          - variant: realsubq
            ref: ''
          # unmodified upstream core, same toolchain: baseline to compare timing
          - variant: upstream
            ref: cd17b5a0ad261005c321d9d5ba41b8dbe313a7d3
    name: build (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Free disk space for the Quartus image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Timing path report script
        run: |
          cat > timing_paths.tcl <<'TCL'
          project_open PSX -revision PSX
          create_timing_netlist
          read_sdc
          set out [open timing_paths.txt w]
          close $out
          foreach_in_collection oc [get_available_operating_conditions] {
            set_operating_conditions $oc
            update_timing_netlist
            set name [get_operating_conditions_info $oc -display_name]
            set out [open timing_paths.txt a]
            puts $out "\n==================== $name ===================="
            close $out
            report_timing -setup -npaths 40 -less_than_slack 0 -detail summary -file timing_paths.txt -append
            report_timing -hold  -npaths 40 -less_than_slack 0 -detail summary -file timing_paths.txt -append
          }
          delete_timing_netlist
          project_close
          TCL

      - name: Compile with Quartus (inside Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            bash -xc '
              export LD_LIBRARY_PATH="/opt/intelFPGA_lite/quartus/linux64:$LD_LIBRARY_PATH"
              export PATH="/opt/intelFPGA_lite/quartus/linux64:/opt/intelFPGA_lite/quartus/bin:$PATH"
              /opt/intelFPGA_lite/quartus/linux64/quartus_sh --flow compile PSX.qpf
              RC=$?
              echo "==== QUARTUS EXIT CODE: $RC ===="
              [ $RC -eq 0 ] && /opt/intelFPGA_lite/quartus/linux64/quartus_sta -t timing_paths.tcl
              exit $RC
            '

      - name: Timing summary (negative slack = timing not met)
        if: always()
        run: |
          sudo chown -R "$(id -u)" output_files timing_paths.txt || true
          cat output_files/PSX.sta.summary || true
          grep -i "Timing requirements not met" output_files/PSX.sta.rpt || echo "no 'Timing requirements not met' message"
          echo "---------------- failing paths ----------------"
          cat timing_paths.txt || true

      - name: Name the rbf
        run: cp output_files/PSX.rbf "PSX_${{ matrix.variant }}_$(date +%Y%m%d).rbf"

      - name: Upload RBF and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSX_${{ matrix.variant }}
          path: |
            PSX_${{ matrix.variant }}_*.rbf
            timing_paths.txt
            output_files/*.summary
            output_files/PSX.sta.rpt
